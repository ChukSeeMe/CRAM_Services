name: Keep Alive

on:
  schedule:
    # Ping every 20 minutes to reduce Azure Container App cold starts
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: ping
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping CRAM Services
        shell: bash
        run: |
          URL="https://cramservices-frontend.whitesea-c505a8c9.uksouth.azurecontainerapps.io/"

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3: ${URL}"

            # Follow redirects and allow enough time for an Azure cold start.
            STATUS=$(curl --location --silent --show-error \
              --output /tmp/cram-response.txt \
              --write-out "%{http_code}" \
              --connect-timeout 20 \
              --max-time 90 \
              "${URL}")
            CURL_EXIT=$?

            echo "curl exit code: ${CURL_EXIT}"
            echo "Final HTTP status: ${STATUS:-none}"

            if [ "${CURL_EXIT}" -eq 0 ] && [[ "${STATUS}" =~ ^2[0-9][0-9]$ ]]; then
              echo "CRAM Services is responding successfully."
              exit 0
            fi

            if [ -s /tmp/cram-response.txt ]; then
              echo "Response preview:"
              head -c 500 /tmp/cram-response.txt
              echo
            fi

            if [ "${attempt}" -lt 3 ]; then
              echo "Waiting 20 seconds before retrying..."
              sleep 20
            fi
          done

          echo "::error::CRAM Services did not return a successful 2xx response after 3 attempts."
          exit 1
